name: movie_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  animate_do: ^5.1.0
  carousel_slider: ^5.1.2
  go_router: ^18.1.1
  easy_localizer: ^0.0.1
  dio: ^5.11.1
  dartz: ^0.10.1
  get_it: ^9.3.0
  flutter_bloc: ^9.1.1
  cached_network_image: ^4.0.3
  flutter_screenutil_plus: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/icons/
    - assets/images/home_images/
    - assets/images/movie_details/


