name: movie_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  animate_do: ^5.1.0
  go_router: ^18.1.1
  carousel_slider: ^5.1.2
  easy_localization: ^3.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  flutter_bloc: ^9.1.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icons/
    - assets/images/
    - assets/translations/


